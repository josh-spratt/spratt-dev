<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.2" fill="#3c3296" fill-opacity="0.22"/>
    </pattern>
    <linearGradient id="name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb3ab"/><stop offset="0.48" stop-color="#e8412f"/>
      <stop offset="0.5" stop-color="#8f1212"/><stop offset="1" stop-color="#f08a7e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#e6edff"/>
    </linearGradient>
    <radialGradient id="btn" cx="50%" cy="62%" r="62%">
      <stop offset="0" stop-color="#f0473c"/><stop offset="1" stop-color="#b0161b"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="0.12" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#281e64" flood-opacity="0.4"/>
    </filter>
    <g id="button">
      <circle cx="0" cy="5" r="34" fill="#6a0c10"/>
      <circle cx="0" cy="0" r="34" fill="url(#btn)" stroke="#7a0f0f" stroke-width="3"/>
      <ellipse cx="0" cy="-16" rx="21" ry="11" fill="url(#hl)"/>
    </g>
  </defs>
  <rect width="1200" height="630" fill="#dfe3f7"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <g filter="url(#shadow)">
    <path d="M100 108a28 28 0 0 1 28-28h944a28 28 0 0 1 28 28v332a110 110 0 0 1-110 110H128a28 28 0 0 1-28-28z" fill="#a28dd9"/>
  </g>
  <path d="M100 108a28 28 0 0 1 28-28h944a28 28 0 0 1 28 28v332a110 110 0 0 1-110 110H128a28 28 0 0 1-28-28z" fill="url(#gloss)"/>
  <!-- screen -->
  <path d="M140 116a14 14 0 0 1 14-14h892a14 14 0 0 1 14 14v186H140z" fill="#2c2555"/>
  <circle cx="170" cy="126" r="7" fill="#ff4b4b"/>
  <text x="186" y="131" font-family="Verdana, DejaVu Sans, sans-serif" font-size="14" fill="#d9d4ff" letter-spacing="2">POWER</text>
  <rect x="160" y="146" width="880" height="146" rx="6" fill="url(#screen)" stroke="#6b5aa8" stroke-width="2"/>
  <text x="190" y="206" font-family="Verdana, DejaVu Sans, sans-serif" font-weight="bold" font-size="40" fill="#1c3297">Engineer</text>
  <text x="190" y="256" font-family="Courier New, monospace" font-size="30" fill="#45436a">jspratt.dev</text>
  <!-- name -->
  <text x="600" y="410" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-weight="800" font-style="italic" font-size="108"
        fill="url(#name)" stroke="#7a0f0f" stroke-width="3" paint-order="stroke">Josh Spratt</text>
  <!-- buttons -->
  <use href="#button" x="820" y="478" transform="rotate(-18 820 478)"/>
  <use href="#button" x="920" y="478" transform="rotate(-18 920 478)"/>
  <use href="#button" x="1020" y="478" transform="rotate(-18 1020 478)"/>
</svg>
